[tool.poetry]
name = "suas-2025"
version = "0.1.0"
description = ""
authors = []
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pip = "^22.0.4"
dronekit = "*"
numpy = "^1.21.2"
opencv-python = "^4.8.0.76"
pytesseract = "^0.3.9"
colorlog = "^6.6.0"
pyproj = "^3.3.0"
pyusb = "^1.2.1"
matplotlib = "^3.5.1"
utm = "^0.7.0"
Shapely = "^1.8.1"
nptyping = "^2.3.1"
scipy = "^1.9.3"
ticlib = "^0.2.2"
pandas = "^1.5.3"
psutil = "^5.9.4"
torch = { version = "^2.3", source = "pytorch-cpu", markers = "extra=='cpu' and extra!='cuda'" }
torchvision = { version = "^0.18", source = "pytorch-cpu", markers = "extra=='cpu' and extra!='cuda'" }
pyyaml = "^6.0"
seaborn = "^0.12.2"
gitpython = "^3.1.31"
setuptools = "^67.4.0"
geopy = "^2.3.0"
pyserial = "^3.5"
pathfinding = "^1.0.1"
siyi-sdk = "^0.2.12"
ffmpeg-python = "^0.2.0"
aiohttp = "^3.11.11"
aiofiles = "^24.1.0"

[tool.poetry.group.cuda]
# All of the following torch specific additions are from https://github.com/lucaspar/poetry-torch
optional = true

[tool.poetry.group.cuda.dependencies]
    torch       = { version = "^2.3", source = "pytorch-cuda", markers = "extra=='cuda' and extra!='cpu'" }
    torchvision = { version = "^0.18", source = "pytorch-cuda", markers = "extra=='cuda' and extra!='cpu'" }

[tool.poetry.extras]
    cpu  = ["torch", "torchvision"]
    cuda = ["torch", "torchvision"]

[[tool.poetry.source]]
    name     = "pytorch-cuda"
    priority = "explicit"
    url      = "https://download.pytorch.org/whl/cu121"

[[tool.poetry.source]]
    name     = "pytorch-cpu"
    priority = "explicit"
    url      = "https://download.pytorch.org/whl/cpu"

[tool.poetry.dev-dependencies]
mypy = "^0.931"
black = "^21.12b0"
pylint = "^2.12.2"
types-aiofiles = "^24.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
